<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="color-scheme" content="light dark">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns=%27http://www.w3.org/2000/svg%27 viewBox=%270 0 32 32%27%3E%3Ccircle cx=%2716%27 cy=%2716%27 r=%2714%27 fill=%27%230b2b33%27/%3E%3Crect x=%279%27 y=%2710%27 width=%278%27 height=%277%27 fill=%27none%27 stroke=%27%23ff5a1f%27 stroke-width=%272%27/%3E%3C/svg%3E">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,600;12..96,700&family=Public+Sans:wght@400;550;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="/css/styles.css">
<title>Sign in — Microplastic Detector</title>
</head>
<body>
<div class="auth-page">
  <aside class="auth-side">
    <a class="brand" href="/"><svg viewBox="0 0 32 32" aria-hidden="true"><circle cx="16" cy="16" r="14" fill="none" stroke="currentColor" stroke-width="2"/><rect x="9" y="10" width="8" height="7" fill="none" stroke="#ff5a1f" stroke-width="2"/><circle cx="21" cy="21" r="2.4" fill="currentColor"/></svg> Microplastic Detector</a>
    <div class="field-wrap"><canvas id="field" aria-hidden="true"></canvas></div>
    <p>Pick up where you left off. Your past analyses are waiting in History.</p>
  </aside>
  <main class="auth-main">
    <div class="auth-card">
      <h1>Sign in</h1>
      <p class="sub">Use the email you registered with.</p>
      <div id="notice" class="alert alert-info" hidden></div>
      <div id="error" class="alert alert-error" role="alert" hidden></div>
      <form id="login-form" novalidate>
        <div class="form-row">
          <label for="email">Email</label>
          <input class="input" id="email" name="email" type="email" autocomplete="email" required>
          <div class="field-error" id="email-error"></div>
        </div>
        <div class="form-row">
          <label for="password">Password</label>
          <div class="pw-wrap">
            <input class="input" id="password" name="password" type="password" autocomplete="current-password" required>
            <button type="button" class="pw-toggle" aria-controls="password" aria-pressed="false">Show</button>
          </div>
          <div class="field-error" id="password-error"></div>
        </div>
        <button class="btn btn-primary btn-block" type="submit">Sign in</button>
      </form>
      <p class="auth-alt">New here? <a href="/register.html">Create an account</a></p>
    </div>
  </main>
</div>
<script type="module" src="/js/auth.js"></script>
</body>
</html>
